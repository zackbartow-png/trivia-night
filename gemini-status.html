<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Helper Status</title><style>body{font-family:Arial,sans-serif;background:#fffaf0;color:#102a56;max-width:760px;margin:60px auto;padding:24px}button{padding:12px 18px;border:0;border-radius:10px;background:#2c96ed;color:#fff;font-weight:700}pre{white-space:pre-wrap;background:#fff;border:1px solid #dce5ef;padding:18px;border-radius:14px;margin-top:20px}</style></head><body><h1>Gemini Helper Status</h1><p>This checks whether the Vercel server function exists and can see the Gemini configuration.</p><button id="check">Check Gemini Setup</button><pre id="result">Not checked yet.</pre><script>document.querySelector('#check').addEventListener('click',async()=>{const el=document.querySelector('#result');el.textContent='Checking…';try{const r=await fetch('/api/ai-helper');const t=await r.text();el.textContent=`HTTP ${r.status}\n${t}`;}catch(e){el.textContent='Connection failed: '+e.message;}});</script></body></html>
