<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffaf0">
  <title>Trivia Night — Presenter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="presenter-page">
  <main class="presenter-shell">
    <div id="stage" class="presenter-stage"></div>

    <footer class="presenter-controls">
      <button id="backBtn" class="presenter-btn presenter-btn-back">← <span>Back</span></button>
      <div class="presenter-meta">
        <strong id="gameName">Trivia Night</strong>
        <span id="progress"></span>
        <button id="fullscreenBtn" class="fullscreen-btn" title="Fullscreen">⛶</button>
      </div>
      <button id="nextBtn" class="presenter-btn presenter-btn-next"><span>Next</span> →</button>
    </footer>
  </main>
  <script src="play.js"></script>
</body>
</html>
